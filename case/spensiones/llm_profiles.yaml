# Named LLM profiles of the spensiones case (selected by LLM_PROFILES_FILE).
# Keys never live here: `api_key_env` names the environment variable that holds each key.
# The agents keep the implicit `default` profile (LLM_* settings) unless their spec binds
# a role to one of these in `models:`.
profiles:
  # Answer-quality judge (cli.judge, EVAL_JUDGE_PROFILE=judge). A different model family than
  # the OpenAI generator to avoid self-preference. DeepSeek processes data on its own servers
  # (China): fine for the public spensiones corpus, review it before judging private data.
  judge:
    provider: deepseek
    model: deepseek-chat
    api_key_env: DEEPSEEK_API_KEY
    temperature: 0
    timeout_seconds: 60

  # Every role of spensiones-rag (bound under `models:` in its spec). Reasoning off: medium (the
  # API default) did worse on the dev sets (calibration/README.md, "Model: gpt-6-luna"). No
  # temperature: reasoning models may reject it.
  luna_none:
    provider: openai
    model: gpt-6-luna
    api_key_env: OPENAI_API_KEY
    reasoning_effort: none
