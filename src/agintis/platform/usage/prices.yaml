# LLM prices in USD per 1M tokens, versioned by effective date (see platform/usage/prices.py).
# A model missing here is reported as UNPRICED, never as $0. Prices are read at report time, so
# fixing a value re-prices the whole history; add a NEW entry when a provider changes its prices.
# Only standard synchronous rates are modelled: no batch/flex/priority tiers, no long-context
# surcharges, no time-of-day discounts.
models:
  gpt-6-luna:
    # Verified 2026-10-24 on developers.openai.com/api/docs/models/gpt-6-luna and
    # developers.openai.com/api/docs/pricing (standard tier). The page states no effective date.
    # Not modelled: prompts over 272K input tokens cost 2x input/cached and 1.5x output.
    - effective_from: 2026-10-01
      input: 0.10
      cached_input: 0.01
      output: 0.50

  deepseek-chat:
    # Legacy name, absent from api-docs.deepseek.com/quick_start/pricing. A live call on
    # 2026-10-24 returned `"model": "deepseek-flash"`, so it is billed at the deepseek-flash price.
    # PEAK rates (upper bound): off-peak is half, outside 01-04 and 06-10 UTC on weekdays.
    # effective_from = the V4.1 Flash price change.
    - effective_from: 2026-09-10
      input: 0.30
      cached_input: 0.006
      output: 1.20
